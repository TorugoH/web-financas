<main class="page-shell">
  <header class="topbar">
    <div class="page-title">
      <h1>Perfil</h1>
      <p class="muted mt-2 mb-0">Dados da conta autenticada.</p>
    </div>
  </header>

  <p-card>
    <ng-template pTemplate="title">Informações pessoais</ng-template>
    <div class="flex flex-column gap-3">
      <div>
        <span class="block muted text-sm mb-1">Nome</span>
        <strong>{{ user()?.nome || 'Usuário autenticado' }}</strong>
      </div>
      <div>
        <span class="block muted text-sm mb-1">E-mail</span>
        <strong>{{ user()?.email || 'E-mail não disponível' }}</strong>
      </div>
    </div>
  </p-card>
</main>
