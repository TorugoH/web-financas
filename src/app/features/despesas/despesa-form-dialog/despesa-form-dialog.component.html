<p-dialog
  [header]="editing ? 'Editar despesa' : 'Adicionar despesa'"
  [modal]="true"
  [visible]="visible"
  [style]="{ width: 'min(92vw, 520px)' }"
  (visibleChange)="visibleChange.emit($event)"
  (onHide)="close()"
>
  <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="w-full mb-4" />

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-column gap-4">
    <label class="flex flex-column gap-2">
      <span>Descrição</span>
      <input pInputText type="text" formControlName="descricao" />
      <small class="field-error" *ngIf="form.controls.descricao.touched && form.controls.descricao.hasError('required')">
        Informe a descrição.
      </small>
    </label>

    <label class="flex flex-column gap-2">
      <span>Valor</span>
      <p-inputNumber formControlName="valor" mode="currency" currency="BRL" locale="pt-BR" [min]="0" />
      <small class="field-error" *ngIf="form.controls.valor.touched && form.controls.valor.hasError('required')">
        Informe o valor.
      </small>
      <small class="field-error" *ngIf="form.controls.valor.touched && form.controls.valor.hasError('min')">
        O valor deve ser maior que zero.
      </small>
    </label>

    <label class="flex flex-column gap-2">
      <span>Tipo</span>
      <p-dropdown formControlName="tipo" [options]="tipos" optionLabel="label" optionValue="value" />
    </label>

    <div class="flex align-items-center justify-content-between gap-3">
      <span>É recorrente?</span>
      <p-inputSwitch formControlName="recorrente" />
    </div>

    <label class="flex flex-column gap-2" *ngIf="form.controls.recorrente.value">
      <span>Dia do pagamento</span>
      <p-inputNumber formControlName="diaPagamento" [min]="1" [max]="31" [showButtons]="true" />
      <small class="field-error" *ngIf="form.controls.diaPagamento.touched && form.controls.diaPagamento.invalid">
        Informe um dia entre 1 e 31.
      </small>
    </label>

    <label class="flex flex-column gap-2" *ngIf="!form.controls.recorrente.value">
      <span>Data de pagamento</span>
      <p-calendar formControlName="dataPagamento" dateFormat="dd/mm/yy" [showIcon]="true" appendTo="body" />
      <small class="field-error" *ngIf="form.controls.dataPagamento.touched && form.controls.dataPagamento.hasError('required')">
        Informe a data de pagamento.
      </small>
    </label>

    <div class="flex justify-content-end gap-2 pt-2">
      <p-button type="button" label="Cancelar" [outlined]="true" severity="secondary" (onClick)="close()" />
      <p-button type="submit" [label]="editing ? 'Atualizar' : 'Salvar'" icon="pi pi-check" [loading]="loading" />
    </div>
  </form>
</p-dialog>

<p-dialog
  header="Alterar valor recorrente"
  [modal]="true"
  [(visible)]="scopeDialogVisible"
  [closable]="!loading"
  [dismissableMask]="!loading"
  [style]="{ width: 'min(92vw, 520px)' }"
  (onHide)="cancelValorScope()"
>
  <p>Voce esta alterando o valor de uma despesa recorrente. Deseja aplicar essa mudanca:</p>

  <div class="flex flex-column sm:flex-row justify-content-end gap-2 pt-3">
    <p-button
      label="Somente este mes"
      icon="pi pi-calendar"
      [outlined]="true"
      [loading]="loading"
      (onClick)="confirmValorScope('APENAS_ESTE_MES')"
    />
    <p-button
      label="Este mes e os futuros"
      icon="pi pi-forward"
      [loading]="loading"
      (onClick)="confirmValorScope('ESTE_E_FUTUROS')"
    />
  </div>
</p-dialog>
