<main class="auth-shell">
  <section class="auth-panel">
    <div class="mb-5">
      <h1>Cadastro</h1>
      <p class="muted mt-2 mb-0">Crie seu acesso para acompanhar suas finanças.</p>
    </div>

    <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="w-full mb-4" />

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-column gap-4">
      <label class="flex flex-column gap-2">
        <span>Nome</span>
        <input pInputText type="text" formControlName="nome" autocomplete="name" />
        <small class="field-error" *ngIf="form.controls.nome.touched && form.controls.nome.hasError('required')">
          Informe o nome.
        </small>
      </label>

      <label class="flex flex-column gap-2">
        <span>E-mail</span>
        <input pInputText type="email" formControlName="email" autocomplete="email" />
        <small class="field-error" *ngIf="form.controls.email.touched && form.controls.email.hasError('required')">
          Informe o e-mail.
        </small>
        <small class="field-error" *ngIf="form.controls.email.touched && form.controls.email.hasError('email')">
          Informe um e-mail válido.
        </small>
      </label>

      <label class="flex flex-column gap-2">
        <span>Senha</span>
        <p-password formControlName="password" [toggleMask]="true" inputStyleClass="w-full" />
        <small class="field-error" *ngIf="form.controls.password.touched && form.controls.password.hasError('required')">
          Informe a senha.
        </small>
        <small class="field-error" *ngIf="form.controls.password.touched && form.controls.password.hasError('minlength')">
          A senha deve ter pelo menos 6 caracteres.
        </small>
      </label>

      <label class="flex flex-column gap-2">
        <span>Confirmar senha</span>
        <p-password formControlName="confirmacao" [feedback]="false" [toggleMask]="true" inputStyleClass="w-full" />
        <small class="field-error" *ngIf="form.controls.confirmacao.touched && form.controls.confirmacao.hasError('required')">
          Confirme a senha.
        </small>
        <small class="field-error" *ngIf="form.touched && form.hasError('senhasDiferentes')">
          As senhas não conferem.
        </small>
      </label>

      <p-button type="submit" label="Cadastrar" icon="pi pi-user-plus" [loading]="loading" styleClass="w-full" />
    </form>

    <div class="flex align-items-center justify-content-center gap-2 mt-5">
      <span class="muted">Já tem conta?</span>
      <a routerLink="/login" class="font-medium">Entrar</a>
    </div>
  </section>
</main>
