<p-sidebar
  position="bottom"
  [visible]="visible"
  [modal]="true"
  [dismissible]="true"
  [showCloseIcon]="false"
  [blockScroll]="true"
  styleClass="renda-bottom-sheet"
  (visibleChange)="visibleChange.emit($event)"
>
  <div class="sheet-handle" aria-hidden="true"></div>

  <header class="sheet-header">
    <div>
      <span class="muted">Extrato mensal</span>
      <h2>{{ label }}</h2>
    </div>
    <p-button icon="pi pi-times" [rounded]="true" [text]="true" ariaLabel="Fechar" (onClick)="close()" />
  </header>

  <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="w-full mb-4" />

  <div *ngIf="loading" class="flex justify-content-center py-6">
    <p-progressSpinner ariaLabel="Carregando lancamentos" />
  </div>

  <p-table *ngIf="!loading" [value]="lancamentos" responsiveLayout="stack" [breakpoint]="'720px'">
    <ng-template pTemplate="header">
      <tr>
        <th>Descricao</th>
        <th>Tipo</th>
        <th>Valor</th>
        <th>Data prevista</th>
        <th class="text-right">Acoes</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-lancamento>
      <tr>
        <td>{{ lancamento.descricao }}</td>
        <td>
          <p-tag [value]="lancamento.tipo" [severity]="lancamento.recorrente ? 'success' : 'info'" />
        </td>
        <td>{{ lancamento.valor | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR' }}</td>
        <td>{{ lancamento.dataPrevista | date: 'dd/MM/yyyy' }}</td>
        <td class="text-right">
          <p-button
            icon="pi pi-pencil"
            label="Editar"
            size="small"
            [text]="true"
            (onClick)="editRenda.emit(lancamento)"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center py-5 muted">Nenhum lancamento encontrado para este mes.</td>
      </tr>
    </ng-template>
  </p-table>
</p-sidebar>
