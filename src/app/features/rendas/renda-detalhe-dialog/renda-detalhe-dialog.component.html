<p-dialog
  [header]="'Extrato de ' + label"
  [modal]="true"
  [visible]="visible"
  [style]="{ width: 'min(94vw, 760px)' }"
  (visibleChange)="visibleChange.emit($event)"
>
  <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="w-full mb-4" />

  <div *ngIf="loading" class="flex justify-content-center py-6">
    <p-progressSpinner ariaLabel="Carregando lançamentos" />
  </div>

  <p-table *ngIf="!loading" [value]="lancamentos" responsiveLayout="stack" [breakpoint]="'720px'">
    <ng-template pTemplate="header">
      <tr>
        <th>Descrição</th>
        <th>Tipo</th>
        <th>Valor</th>
        <th>Data prevista</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-lancamento>
      <tr>
        <td>{{ lancamento.descricao }}</td>
        <td>
          <p-tag [value]="lancamento.tipo" [severity]="lancamento.recorrente ? 'success' : 'info'" />
        </td>
        <td>{{ lancamento.valor | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR' }}</td>
        <td>{{ lancamento.dataPrevista | date: 'dd/MM/yyyy' }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center py-5 muted">Nenhum lançamento encontrado para este mês.</td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>
