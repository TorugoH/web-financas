<main class="page-shell renda-page">
  <app-renda-fab-button (add)="openCreate()" />

  <header class="topbar">
    <div class="page-title">
      <h1>Rendas</h1>
      <p class="muted mt-2 mb-0">Resumo mensal das entradas cadastradas.</p>
    </div>
  </header>

  <section class="summary-section">
    <div class="section-heading">
      <h2>Resumo mensal</h2>
      <span class="muted">Role para ver meses anteriores e futuros</span>
    </div>

    <p-message *ngIf="editErrorMessage" severity="warn" [text]="editErrorMessage" styleClass="w-full" />

    <app-renda-mes-card-list
      [refreshKey]="refreshKey"
      (viewMonth)="openDetalhe($event)"
      (editMonth)="openEdit($event)"
    />
  </section>

  <app-renda-form-dialog
    [(visible)]="formVisible"
    [renda]="selectedRenda"
    [mesReferencia]="selectedMonth?.periodo || ''"
    (saved)="onSaved()"
  />

  <app-renda-detalhe-dialog
    [(visible)]="detalheVisible"
    [periodo]="selectedMonth?.periodo || ''"
    [label]="selectedMonth?.label || ''"
    [refreshKey]="refreshKey"
    (editRenda)="editRenda($event)"
  />
</main>
